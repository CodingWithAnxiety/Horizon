name: PR Build

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-26
            platform: macos
          - os: windows-latest
            platform: windows
    outputs:
      sha: ${{ steps.info.outputs.sha }}
    steps:
      - name: Get build info
        id: info
        shell: bash
        run: |
          pr_number="${GITHUB_REF#refs/pull/}"
          pr_number="${pr_number%/merge}"
          echo "version=pr-${pr_number}" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install OS-specific Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install OS-specific Dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install python-setuptools

      - name: Install OS-specific Dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: npm install --global node-gyp

      - name: Run Build Script (Linux)
        if: matrix.platform == 'linux'
        env:
          PR_VERSION: ${{ steps.info.outputs.version }}
        run: |
          chmod +x electron/release-scripts/linux-dev.sh
          electron/release-scripts/linux-dev.sh "$PR_VERSION" "$GITHUB_WORKSPACE/release_artifacts/linux/$PR_VERSION"

      - name: Run Build Script (macOS)
        if: matrix.platform == 'macos'
        env:
          PR_VERSION: ${{ steps.info.outputs.version }}
        run: |
          chmod +x electron/release-scripts/macos-dev.sh
          electron/release-scripts/macos-dev.sh "$PR_VERSION" "$GITHUB_WORKSPACE/release_artifacts/macos/$PR_VERSION"

      - name: Run Build Script (Windows)
        if: matrix.platform == 'windows'
        env:
          PR_VERSION: ${{ steps.info.outputs.version }}
        shell: pwsh
        run: |
          .\electron\release-scripts\windows-dev.ps1 -ReleaseVersion "$env:PR_VERSION" -ReleasePath "$env:GITHUB_WORKSPACE\release_artifacts\windows\$env:PR_VERSION"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-PR${{ github.event.pull_request.number }}-${{ steps.info.outputs.sha }}-${{ matrix.platform }}
          path: release_artifacts/**
          retention-days: 14

  comment:
    name: Post Download Links
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Build PR Comment
        id: comment_body
        run: |
          SHA='${{ needs.build.outputs.sha }}'
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          cat >> $GITHUB_OUTPUT <<COMMENT_END
          ## Test Builds Ready

          **Commit:** \`${SHA}\`

          | Platform | Artifact |
          |----------|----------|
          | Linux | [AppImage](${ARTIFACTS_URL}) |
          | Windows | [Portable EXE](${ARTIFACTS_URL}) |
          | macOS | [ZIP (universal)](${ARTIFACTS_URL}) |

          > Download from the [workflow artifacts](${ARTIFACTS_URL}). Expires in 14 days.
          COMMENT_END
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: Preview Comment
        run: |
          echo "--- PR Comment Preview ---"
          echo "${{ steps.comment_body.outputs.body }}"
          echo "---"

      - name: Post or Update PR Comment
        if: ${{ !env.ACT }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.comment_body.outputs.body }}`;
            const prNumber = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Test Builds Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
